name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'project/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK (preinstalled)
        run: |
          SDK="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH

      - name: Install required packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Persistent debug keystore
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/.ctoa-debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "creating new keystore (first run)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CtoA Debug,O=CtoA,C=US"
            git config user.email "ctoa-bot@users.noreply.github.com"
            git config user.name "CtoA Bot"
            git add -f "$KEYSTORE"
            git commit -m "CtoA: persist debug keystore [skip ci]" || true
            git push || true
          else
            echo "reusing existing keystore"
          fi
          mkdir -p ~/.android
          cp "$KEYSTORE" ~/.android/debug.keystore

      - name: Create local.properties
        working-directory: project
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Get short SHA
        if: success()
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.vars.outputs.sha }}
          name: "Build ${{ steps.vars.outputs.sha }}"
          files: project/app/build/outputs/apk/debug/*.apk
          make_latest: true

      - name: Cleanup old releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[10:] | .[].tagName' | while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag || true
          done
